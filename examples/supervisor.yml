# Agent Daemon — example SUPERVISOR configuration
#
# A supervisor config enumerates existing per-workflow configs (the same files
# you would pass to bin/agent-daemon) by a unique name. The master loads each
# referenced config and keys every runner by a composite (workflow, runner)
# identity.
#
# Run it with: bin/agent-supervisor supervisor.yml
#
# Like a per-workflow config, this file is rendered as an ERB template before
# YAML parsing, so `<%%= secret('KEY') %>` / `<%%= ENV['KEY'] %>` work here too.

# Each entry references an EXISTING per-workflow config by a name that must be
# unique across this file. The `config` path resolves relative to THIS file's
# directory. Two workflows may share a project_path, but must NOT resolve to the
# same message_dir, the same runner output_dir, or the same trigger work-dir
# (input_dir/archive_dir/failed_dir) — a collision is rejected at load with a
# ConfigError.
workflows:
  - name: task-analyst                    # becomes the `workflow` half of every identity
    config: workflows/task-analyst.yml     # path to a per-workflow config, relative to this file
  - name: reviewer
    config: workflows/reviewer.yml

# Bytes of output retained per run, per runner, by the master's in-memory
# output buffer. Default 262144 (256 KiB); accepted range 16384-4194304
# (16 KiB-4 MiB). Applies whether or not a console is configured.
# The same value also caps a single line's size: a newline-free line longer
# than this is force-split into multiple records at this boundary.
# output_buffer_bytes: 262144

# Optional web console. OMIT THIS WHOLE BLOCK and no server is started and
# nothing below is validated — a supervisor config without it behaves exactly
# as it did before the console existed.
#
# Uncomment and fill in to enable it. Every key under `auth` is required; there
# are deliberately no defaults for credentials. The block is validated eagerly
# at load, and every problem is reported at once.
#
# console:
#   bind: 127.0.0.1        # default 127.0.0.1 — loopback. Put a TLS terminator
#                          # in front rather than binding this to 0.0.0.0.
#   port: 9292             # default 9292
#   max_threads: 16        # default 16 — must stay ABOVE the peak number of
#                          # concurrent SSE views; each one parks a thread.
#                          # For the supported <10 viewers, 16 leaves headroom
#                          # for HTML, OAuth, health and reconnect requests.
#   session_ttl: 28800     # default 28800 (8 hours), in seconds
#   secure_cookies: true   # default true; set false ONLY for plain-HTTP local dev
#   base_url: https://console.example.com   # REQUIRED — the public origin of this
#                          # console. The GitLab redirect_uri is built from it
#                          # (<base_url>/auth/callback) and must match the one
#                          # registered in the GitLab application exactly.
#   auth:
#     gitlab_host: https://gitlab.example.com   # REQUIRED — gitlab.com or self-hosted
#     app_id: <%%= secret('GITLAB_APP_ID') %>     # REQUIRED — GitLab application id
#     app_secret: <%%= secret('GITLAB_APP_SECRET') %>   # REQUIRED — application secret
#
#     # REQUIRED, non-empty. A user may sign in iff one of these EXACTLY equals
#     # one of their GitLab group full_paths (case-sensitive). GitLab already
#     # expands inherited membership, so listing a parent group admits its
#     # members; a user who only belongs to `backoffice/interns` is NOT admitted
#     # by `backoffice` — list the subgroup explicitly if you want it.
#     allowed_groups:
#       - backoffice
#       - platform/sre
#
#     # OPTIONAL. Parsed and validated (known role names only, and every group
#     # must appear in allowed_groups), but NOT enforced in v1: every allowed
#     # user may view everything. Known roles: viewer, operator.
#     roles:
#       viewer:
#         - backoffice
#       operator:
#         - platform/sre
#
# The GitLab application needs the `read_api` scope (read_user cannot see group
# membership) and its redirect URI set to <base_url>/auth/callback.
#
# /healthz is the only unauthenticated route that serves content — a bare
# liveness probe for systemd, answering GET and HEAD. The login legs
# (/auth/login, /auth/callback) are necessarily reachable without a session
# too, but they are answered by the auth middleware and never reach the app.
# Everything else requires a GitLab login.
#
# Authenticated pages open GET /events using SSE. The server revalidates the
# local session every 250 ms and GitLab group membership at most once per
# session per 60 s; lookup failure or group loss revokes the session. The
# stream sends fixed refresh invalidations and an approximately 15 s comment
# heartbeat. A reverse proxy must disable response buffering for /events
# (the app also sends X-Accel-Buffering: no) and must permit long-lived
# text/event-stream responses. On reconnect the browser fetches the current
# page, so gaps are repaired from current state plus bounded in-memory events.
#
# Exact unauthenticated boundary: GET/HEAD /healthz serves the bare probe;
# GET /auth/login and GET /auth/callback are handled by Auth; POST /auth/logout
# still requires an authenticated session and CSRF token. /events is never
# public.
