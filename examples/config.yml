# Agent Daemon — example configuration
#
# Copy this file, fill in your values, and pass the path to bin/agent-daemon:
#   bin/agent-daemon /path/to/config.yml
#
# This file is rendered as an ERB template before YAML parsing, so secrets can
# stay out of the file and come from the process environment instead:
#   token: <%%= secret('TRACKER_TOKEN') %>   # fail-fast, YAML-safe
#   org_id: <%%= ENV['TRACKER_ORG_ID'] %>    # raw, lenient (unset -> empty)
# `secret('KEY')` reads ENV['KEY'], raises a ConfigError naming the key when it
# is unset, and quotes the value so tokens/URLs with #, :, ?, & or quotes parse
# intact. Populate ENV however you like, e.g.:
#   sops exec-env secrets.enc.yml -- bin/agent-daemon config.yml
# See docs/secrets.md for details.

# Absolute path to the project where your agent CLI (Claude Code / OpenCode)
# is configured (CLAUDE.md, .opencode.json, MCP settings, etc.).
project_path: /home/deploy/my-project

# Directory for YAML message files exchanged between runners and the Messenger.
# Relative to project_path (or absolute). Default: "to_message".
# When running multiple systemd instances, each MUST have a unique message_dir.
# message_dir: to_message

# OPTIONAL, for humans only — the daemon never reads these. The supervisor
# console renders them so whoever is on support, and did not write this file,
# can tell what the flow is for and who to ask. Both keys are also accepted on
# an individual runner (see `triage` below), where they describe that one piece
# of work; a runner without them falls back to nothing, and the console still
# shows this workflow-level block on its page.
#
# description: |
#   Triages new tracker tasks and reviews merge requests.
#   Runs against the my-project checkout on deploy-01.
# support:
#   owner: "@alexander"          # who to ask
#   runbook: https://wiki.example.com/flows/my-project   # http(s) only
#   on_failure: |                # what support should try first
#     Check that TRACKER_TOKEN is still valid, then press Restart
#     in the console. Escalate if it crashes twice in a row.

# Yandex Tracker API credentials (required only if you have tracker-type runners).
tracker:
  token: <%= secret('TRACKER_TOKEN') %>   # or inline: "your-oauth-token"
  org_id: "your-cloud-org-id"
  # base_url: "https://api.tracker.yandex.net"  # default
  # Seconds to back off after a 429 when the server sends no usable
  # Retry-After header. Default: 60.
  # default_backoff: 60

# Each runner is a separate daemon thread with its own trigger, agent,
# backend, and prompt template.
runners:
  # --- Example 1: Tracker runner (polls Yandex Tracker via JQL) ---
  - name: triage
    backend: claude            # "claude" (default) or "opencode"
    agent: task-analyst        # --agent flag passed to the CLI
    # agent: null              # pass no --agent at all (both backends)
    # claude:                  # optional, "claude" backend only
    #   model: haiku           # --model flag; omit to let the CLI choose
    # Optional operator-controlled alternative for this Claude runner. At
    # backend construction time, exact FALLBACK_AGENT=1 selects this command;
    # every other value keeps Claude. Each token and the final rendered prompt
    # are shell-escaped independently. Ignored for OpenCode runners.
    # fallback_agent:
    #   command: omp
    #   args: [--print, --auto-approve, --model, gpt-5.3-codex]
    # Same optional, human-only pair as at the top of this file, scoped to this
    # one runner. Shown in the console next to this runner's name; note that
    # every runner key is also a prompt variable, so `{{description}}` works in
    # the template too.
    # description: Picks up open tracker tasks that have no analysis yet.
    # support:
    #   owner: "@alexander"
    #   runbook: https://wiki.example.com/flows/my-project#triage
    #   on_failure: Usually an expired TRACKER_TOKEN.
    # extra_flags: ""          # additional CLI flags
    # timeout: 1200            # single backend invocation timeout (seconds), default 20 min
    # max_attempts: 3          # max retries per work item before skipping
    trigger:
      type: tracker
      # Raw JQL query passed verbatim to /v2/issues/_search.
      query: 'Queue: PROJ AND Status: "New"'
      interval: 300            # polling interval in seconds (default 60)
      # jitter: 5              # random 0..jitter s added per cycle to de-phase
                               # parallel pollers; 0 disables (default 5)
    prompt_template: prompts/default.txt
    # output_dir: to_message   # set if the agent writes message files
    #
    # Any extra key here is available in the prompt template as {{key}}.
    signature: "Best regards, Bot"
    status_needs_info: "Needs Info"
    status_backlog: "Backlog"

  # --- Example 2: File runner (polls a directory for YAML work items) ---
  - name: reviewer
    backend: claude
    agent: reviewer
    max_attempts: 2
    trigger:
      type: file
      input_dir: review_inbox            # relative to project_path
      archive_dir: review_inbox/processed
      failed_dir: review_inbox/failed
      interval: 10                       # polling interval in seconds (default 10)
      # jitter: 5                        # random 0..jitter s added per cycle (default 5)
    prompt_template: prompts/default.txt

  # --- Example 3: OpenCode backend ---
  # - name: support
  #   backend: opencode
  #   agent: support-agent
  #   opencode:
  #     model: anthropic/claude-sonnet-4-20250514
  #     extra_flags: ""
  #   trigger:
  #     type: tracker
  #     query: 'Queue: HELP AND Status: "Open"'
  #     interval: 300
  #   prompt_template: prompts/default.txt

  # --- Example 4: Mattermost mention/direct-message trigger (WebSocket, push) ---
  # Listens over a WebSocket for @-mentions of the bot in the listed channels,
  # writes each one as a work item, and runs the agent on it. The agent replies
  # back into the originating thread by writing a message YAML (see
  # prompts/mention.txt) that the Messenger's `mattermost` transport delivers.
  # Requires the `eventmachine` + `faye-websocket` gems (the daemon's only
  # runtime deps, used solely by this trigger).
  # - name: mentions
  #   backend: claude
  #   agent: assistant
  #   trigger:
  #     type: mattermost
  #     base_url: "https://chat.example.com"   # Mattermost/Loop server root
  #     token: <%= secret('MM_BOT_TOKEN') %>   # bot access token
  #     team: your-team-slug                   # channel names resolve within this team
  #     channels:                              # only @-mentions in these channels trigger;
  #                                            # may be [] when direct_users is configured
  #       - support
  #       - general
  #     # Optional: incoming one-to-one direct messages from these usernames
  #     # trigger without an @-mention. Every non-DM post still requires the
  #     # configured team, channel, and bot mention.
  #     # direct_users:
  #     #   - alexander.shvaykin
  #     # interval: 2          # inbox poll interval, seconds (default 2)
  #     # jitter: 0            # random 0..jitter s added per cycle (default 0)
  #     # Work dirs default to mentions/<name>/{inbox,done,failed} under
  #     # project_path; override any of them explicitly if you like:
  #     # input_dir: mentions/mentions/inbox
  #     # archive_dir: mentions/mentions/done
  #     # failed_dir: mentions/mentions/failed
  #   prompt_template: prompts/mention.txt
  #   message_dir: to_message   # where the reply YAML is written (default to_message)
  #   # output_dir: to_message  # set if the agent writes other message files

  # Example 5: a Pachca bot answering questions.
  #
  # A poller, not a listener: Pachca has no realtime API, and its event history
  # needs no public URL at all — enable "save event history" on the bot and
  # leave its Webhook URL empty. Reading plus deleting makes that history a
  # queue with an explicit ack, so nothing is answered twice.
  #
  # - name: qa
  #   backend: claude
  #   trigger:
  #     type: pachca
  #     token: <%= secret('PACHCA_BOT_TOKEN') %>
  #     # Required, and not just bookkeeping: the agent replies into the chat it
  #     # reads, so without its own id it re-ingests its own answers and loops.
  #     bot_user_id: 111
  #     # Optional. Absent means every chat the bot receives, which is what lets
  #     # direct messages work at all (a DM's chat id cannot be known upfront).
  #     # A listed chat also matches its threads, whose own chat_id differs.
  #     # chats: [900, 901]
  #     # Optional allowlist of author user ids. While it is empty, the right to
  #     # command the agent is the right to talk to the bot.
  #     # allowed_users: [42]
  #     # Pachca renders a live timer for a reaction named agent-thinking, which
  #     # is the acknowledgement a run lasting minutes needs. Create the custom
  #     # reaction first; set to null to switch the indicator off.
  #     # thinking_reaction: agent-thinking
  #     # How many earlier thread messages to put in front of the question, as
  #     # {{thread_context}}. Threads only: a reply there is routinely
  #     # unreadable on its own, while a question asked in a channel carries
  #     # its own context and recent channel chatter would be noise. 0 is off.
  #     # 50 is the default and what one request returns; above that the client
  #     # pages through the cursor, one request per 50, capped at 500. The
  #     # default stays at one request because most threads never reach it.
  #     # context_messages: 50
  #     # event_types: [message_new]   # default
  #     # interval: 5                  # poll interval, seconds (default 5)
  #     # jitter: 1                    # random 0..jitter s per cycle (default 1)
  #   prompt_template: prompts/qa.txt
  #
  # The prompt gets the payload flattened: {{message}}, {{sender_id}},
  # {{chat_id}}, {{message_id}}, {{entity_type}}, {{entity_id}},
  # {{parent_message_id}}, {{thread_message_id}}, {{thread_chat_id}},
  # {{event_id}}, {{created_at}}, {{url}}, plus {{thread_context}} — the thread
  # so far as a transcript, the agent's own lines labelled "bot".
  #
  # To answer in the originating thread the reply YAML echoes entity_type and
  # entity_id straight back, plus reply_to_message_id so a question asked in a
  # channel gets a thread created for it. The transport picks between the two;
  # a prompt cannot be trusted to branch on where the question came from.

# Messenger thread — picks up YAML files from message_dir and delivers them
# via the configured transport. Select the transport with `type` (default
# "webhook"). The thread only starts when the selected transport is fully
# configured.
messenger:
  interval: 30

  # --- webhook transport (default) ---
  # POSTs JSON {text: "..."} to a single incoming webhook URL. Any `channel`
  # or `user` routing fields in a message are ignored (one fixed destination).
  type: webhook
  webhook_url: <%= secret('WEBHOOK_URL') %>   # or inline: "https://chat.example.com/hooks/..."

  # --- mattermost transport (Loop bot REST API) ---
  # Reaches any channel by name and DMs any user with one bot token. Messages
  # may carry an optional `channel` or `user` field (resolved to ids and
  # cached); messages with neither — including SYSTEM:<runner> errors — go to
  # default_channel. The bot must be a member of (or allowed to post to) the
  # target channels.
  # A message YAML may also carry a `channel_id` + `root_id` pair to post a
  # threaded reply verbatim — this is how the `mattermost` mention trigger
  # answers in-thread (see Example 4 above).
  # type: mattermost
  # base_url: "https://chat.example.com"      # Mattermost/Loop server root
  # token: <%= secret('MM_BOT_TOKEN') %>      # bot access token
  # team: your-team-slug                      # channel names resolve within this team
  # default_channel: alerts                   # fallback for unaddressed messages

  # --- pachca transport ---
  # Everything is addressed by numeric id, so there is no name resolution and
  # nothing to cache — and a direct message needs no channel opened first.
  # A message YAML picks its destination by precedence: entity_id (with an
  # optional entity_type, which is how the pachca trigger answers in-thread) ->
  # user (DM) -> chat_id -> default_chat_id. An optional parent_message_id
  # threads the post.
  # type: pachca
  # token: <%= secret('PACHCA_BOT_TOKEN') %>  # bot access token
  # # base_url: "https://api.pachca.com"      # default
  # default_chat_id: 900                      # numeric id, not a name: where an
  #                                           # unaddressed message goes, which
  #                                           # includes SYSTEM:<runner> errors

logging:
  level: info
  # output: stdout or file (default: file)
  # Use "stdout" when running under systemd/journald.
  output: file
  file: logs/agent-daemon.log
